[project]
name = "pasteforge"
version = "0.3.2"
description = "A lightweight paste-sharing service built with FastAPI"
authors = [
    { name = "Abolfazl Kameli", email = "abolfazlkameli0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.144.0",
    "pydantic-settings>=2.16.0",
    "pydantic[email,timezone]>=2.14.1",
    "python-jose>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]